name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate Dagster definitions
        run: dagster definitions validate -m pipelines.definitions

      - name: Unit and pipeline tests (synthetic data, CPU)
        run: pytest

  train-smoke:
    name: Train both models on real C-MAPSS data (CPU), gates, promotion
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      PROGNOSTIC_DEVICE: cpu
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt matplotlib

      - name: Cache C-MAPSS data
        uses: actions/cache@v4
        with:
          path: data
          key: cmapss-fd001-${{ hashFiles('download_data.py') }}

      - name: Download and verify data
        run: python download_data.py

      - name: Full pipeline (XGBoost + short LSTM run, gates, promotion)
        run: |
          python run_pipeline.py --device cpu --lstm-epochs 15 \
            --xgb-rmse-gate 15 --lstm-rmse-gate 25 --zip-out mlflow-run.zip

      - name: Show report
        if: always()
        run: cat reports/model_comparison.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload MLflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-${{ github.sha }}
          path: |
            mlflow-run.zip
            reports/
          retention-days: 14
